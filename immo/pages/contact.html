<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — ImmoPlus</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">ImmoPlus</div>
      <ul class="nav-links">
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="annonces.html">Annonces</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="contact-section">
    <h1>Contactez-nous</h1>
    <p style="color:#666; margin-bottom:2rem;">
      Notre équipe est disponible du lundi au samedi, de 9h à 19h.
    </p>

    <form id="contactForm">
      <div class="form-group">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" name="nom" placeholder="Jean Dupont" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jean@email.com" required />
      </div>
      <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" name="telephone" placeholder="06 00 00 00 00" />
      </div>
      <div class="form-group">
        <label for="sujet">Sujet</label>
        <select id="sujet" name="sujet">
          <option value="achat">Projet d'achat</option>
          <option value="location">Projet de location</option>
          <option value="vente">Mettre en vente / louer mon bien</option>
          <option value="estimation">Estimation gratuite</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Décrivez votre projet..." required></textarea>
      </div>
      <button type="submit" class="btn-submit">Envoyer le message</button>
    </form>

    <div class="success-msg" id="successMsg">
      ✔ Votre message a bien été envoyé. Nous vous répondrons dans les plus brefs délais.
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ImmoPlus. Tous droits réservés.</p>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
