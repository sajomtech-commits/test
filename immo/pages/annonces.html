<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annonces — ImmoPlus</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">ImmoPlus</div>
      <ul class="nav-links">
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="annonces.html">Annonces</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-header">
    <h1>Toutes nos annonces</h1>
  </div>

  <div class="filters">
    <select id="filterType">
      <option value="">Tous types</option>
      <option value="appartement">Appartement</option>
      <option value="maison">Maison</option>
      <option value="terrain">Terrain</option>
      <option value="commercial">Local commercial</option>
    </select>
    <select id="filterTransaction">
      <option value="">Achat / Location</option>
      <option value="achat">Achat</option>
      <option value="location">Location</option>
    </select>
    <input type="number" id="filterMaxPrice" placeholder="Prix max (€)" min="0" />
    <input type="text" id="filterSearch" placeholder="Ville ou mot-clé..." />
    <button id="applyFilters">Filtrer</button>
  </div>

  <div style="padding: 1.5rem 2rem 0;">
    <p class="results-count" id="resultsCount"></p>
  </div>

  <div class="listings-page listings" id="listingsPage"></div>

  <footer>
    <p>&copy; 2026 ImmoPlus. Tous droits réservés.</p>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
